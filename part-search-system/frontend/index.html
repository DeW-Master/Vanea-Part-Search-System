<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>van.ea 车辆零件智能查询 / Vehicle Parts Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23c0c0c0' d='M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ==================== Reset & Variables ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Mercedes Black & Silver Palette */
      --primary: #c0c0c0;
      --primary-dark: #8a8a8a;
      --primary-light: #1e1e1e;
      --primary-hover: #d8d8d8;
      --silver: #e8e8e8;
      --silver-mid: #b0b0b0;
      --silver-dark: #707070;

      --bg: #0a0a0a;
      --bg-alt: #0f0f0f;
      --card-bg: #141414;
      --card-bg-alt: #1a1a1a;
      --text: #e8e8e8;
      --text-secondary: #9a9a9a;
      --text-light: #5a5a5a;
      --border: #2a2a2a;
      --border-light: #1f1f1f;
      --border-bright: #3a3a3a;

      --success: #5b9d6e;
      --success-light: #16291c;
      --warning: #c9a227;
      --warning-light: #2a2415;
      --danger: #c75450;
      --danger-light: #2a1717;
      --info: #5b9aa0;
      --info-light: #152224;
      --purple: #9a8ab8;
      --purple-light: #1e1a2a;

      --shadow-sm: none;
      --shadow: 0 1px 0 var(--border);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.7);
      --radius: 3px;
      --radius-sm: 2px;
      --radius-lg: 4px;
      --header-height: 64px;
      --metallic-btn: linear-gradient(180deg, #e8e8e8 0%, #c0c0c0 50%, #a8a8a8 100%);
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==================== Header ==================== */
    .header {
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      color: var(--silver);
      padding: 0 32px;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-bright);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: #fff;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-title {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: var(--silver);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .header-title .brand {
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #e8e8e8, #b0b0b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-title .brand-sub {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .version-badge {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: var(--radius-sm);
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      background: transparent; color: var(--silver-dark);
      border: 1px solid var(--border-bright);
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-bright);
      padding: 6px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 400;
      color: var(--silver-mid);
      transition: all 0.2s;
    }

    .agent-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .agent-badge.offline .dot {
      background: var(--warning);
    }

    .lang-toggle {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--silver-mid);
      padding: 6px 18px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-toggle:hover {
      background: var(--card-bg-alt);
      color: var(--silver);
      border-color: var(--silver-dark);
    }

    .lang-switch-group {
      display: flex;
      gap: 2px;
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--silver-mid);
      padding: 5px 12px;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .lang-btn:hover {
      color: var(--silver);
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.2);
    }

    .admin-link {
      color: var(--silver-mid);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border-bright);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .admin-link:hover {
      background: var(--card-bg-alt);
      color: var(--silver);
      border-color: var(--silver-dark);
    }
    .admin-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* ==================== Stats Bar ==================== */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 24px 32px;
      max-width: 1600px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 180px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s, background 0.2s;
    }

    .stat-card:hover {
      border-color: var(--border-bright);
      background: var(--card-bg-alt);
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .stat-icon svg { width: 22px; height: 22px; }
    .stat-icon.blue { background: var(--primary-light); color: var(--silver); border-color: var(--silver-dark); }
    .stat-icon.green { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .stat-icon.orange { background: var(--warning-light); color: var(--warning); border-color: var(--warning); }
    .stat-icon.purple { background: var(--purple-light); color: var(--purple); border-color: var(--purple); }

    .stat-info { min-width: 0; }
    .stat-value { font-size: 24px; font-weight: 300; line-height: 1.2; color: var(--silver); letter-spacing: 0.5px; }
    .stat-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ==================== Main Content ==================== */
    .main-content {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 32px 32px;
    }

    /* ==================== Tabs ==================== */
    .tabs {
      display: flex;
      gap: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }

    .tab-btn:hover {
      background: var(--card-bg-alt);
      color: var(--silver);
    }

    .tab-btn.active {
      background: var(--metallic-btn);
      color: #0a0a0a;
      font-weight: 600;
    }

    .tab-btn svg { width: 18px; height: 18px; }

    .tab-content { display: none; }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== Agent Tab ==================== */
    .agent-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 340px);
      min-height: 450px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .chat-message {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-avatar.agent { background: var(--metallic-btn); color: #0a0a0a; }
    .chat-avatar.user { background: var(--card-bg-alt); color: var(--silver); border: 1px solid var(--border-bright); }
    .chat-avatar svg { width: 20px; height: 20px; fill: currentColor; }

    .chat-bubble-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-bubble {
      background: var(--card-bg-alt);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 2px var(--radius) var(--radius) var(--radius);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    .chat-message.user .chat-bubble {
      background: var(--metallic-btn);
      color: #0a0a0a;
      border: 1px solid var(--silver-dark);
      border-radius: var(--radius) 2px var(--radius) var(--radius);
      font-weight: 500;
    }

    .chat-meta {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .chat-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .chat-tag.mode-ollama { background: var(--info-light); color: var(--info); border-color: var(--info); }
    .chat-tag.mode-rule { background: var(--warning-light); color: var(--warning); border-color: var(--warning); }
    .chat-tag.related { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .chat-tag.off-topic { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
    .chat-tag.intent { background: var(--purple-light); color: var(--purple); border-color: var(--purple); }

    .chat-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--silver-dark);
      color: var(--silver);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .chat-action-btn:hover {
      background: var(--metallic-btn);
      color: #0a0a0a;
      border-color: var(--silver);
    }
    .chat-action-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* Detailed records in chat */
    .chat-records {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-record-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
    }

    .chat-record-card .record-source {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-record-card .record-fields {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .chat-record-card .field-label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 12px;
      align-self: flex-start;
      animation: slideIn 0.3s ease;
    }

    .typing-dots {
      background: var(--card-bg-alt);
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 2px var(--radius) var(--radius) var(--radius);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--silver-mid);
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ==================== Suggestions ==================== */
    .chat-scroll-tip {
      padding: 14px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: linear-gradient(180deg, rgba(0,212,255,0.02), transparent);
      transition: all 0.3s ease;
    }

    .chat-scroll-tip.hidden {
      display: none;
    }

    .chat-tip-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(179,136,255,0.1));
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-tip-icon svg {
      width: 18px;
      height: 18px;
    }

    .chat-tip-body {
      flex: 1;
      min-width: 0;
    }

    .chat-tip-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--silver);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .chat-tip-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .suggestions {
      padding: 12px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .suggestions-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-right: 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .suggestion-chip {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--silver-mid);
    }

    .suggestion-chip:hover {
      background: var(--card-bg-alt);
      border-color: var(--silver-dark);
      color: var(--silver);
    }

    /* ==================== Chat Input ==================== */
    .chat-input-area {
      padding: 16px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.2s;
      outline: none;
      line-height: 1.5;
      background: var(--bg-alt);
      color: var(--text);
    }

    .chat-input::placeholder { color: var(--text-light); }

    .chat-input:focus {
      border-color: var(--silver-dark);
      box-shadow: 0 0 0 1px var(--silver-dark);
    }

    .send-btn {
      padding: 12px 22px;
      background: var(--metallic-btn);
      color: #0a0a0a;
      border: 1px solid var(--silver-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .send-btn:hover {
      background: linear-gradient(180deg, #f0f0f0 0%, #d0d0d0 50%, #b8b8b8 100%);
      border-color: var(--silver);
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .stop-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 12px 20px; border: 1px solid var(--danger); border-radius: var(--radius-sm);
      background: transparent; color: var(--danger); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit;
    }
    .stop-btn:hover { background: var(--danger); color: #fff; }
    .stop-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .agent-model-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 28px; background: var(--bg-alt);
      border-bottom: 1px solid var(--border); gap: 12px;
    }
    .model-info { display: flex; align-items: center; gap: 10px; }
    .model-label { font-size: 12px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .model-selector {
      padding: 6px 12px; border: 1px solid var(--border-bright); border-radius: var(--radius-sm);
      background: var(--card-bg); color: var(--text); font-size: 13px;
      cursor: pointer; outline: none; max-width: 220px; font-family: inherit;
    }
    .model-selector:hover { border-color: var(--silver-dark); }
    .model-selector:focus { border-color: var(--silver-dark); box-shadow: 0 0 0 1px var(--silver-dark); }
    .model-selector option { background: var(--card-bg); color: var(--text); }
    .model-mode {
      font-size: 11px; padding: 3px 10px; border-radius: var(--radius-sm);
      background: var(--success-light); color: var(--success); font-weight: 600;
      border: 1px solid var(--success); letter-spacing: 0.3px;
    }
    .model-mode.rule { background: var(--warning-light); color: var(--warning); border-color: var(--warning); }
    .model-mode.cloud { background: var(--info-light); color: var(--info); border-color: var(--info); }

    /* ==================== Search Tab ==================== */
    .search-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      position: relative;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg-alt);
      color: var(--text);
    }

    .search-input::placeholder { color: var(--text-light); }

    .search-input:focus {
      border-color: var(--silver-dark);
      box-shadow: 0 0 0 1px var(--silver-dark);
    }

    .search-input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      display: flex;
    }

    .search-input-icon svg { width: 18px; height: 18px; fill: currentColor; }

    .search-btn {
      padding: 14px 30px;
      background: var(--metallic-btn);
      color: #0a0a0a;
      border: 1px solid var(--silver-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-btn:hover {
      background: linear-gradient(180deg, #f0f0f0 0%, #d0d0d0 50%, #b8b8b8 100%);
      border-color: var(--silver);
    }
    .search-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Autocomplete dropdown */
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      max-height: 250px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      margin-top: 4px;
    }

    .autocomplete-dropdown.show { display: block; }

    .autocomplete-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .autocomplete-item:last-child { border-bottom: none; }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: var(--card-bg-alt);
      color: var(--silver);
    }

    /* ==================== Search Results ==================== */
    .search-results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-results-count { font-size: 14px; color: var(--text-secondary); }
    .search-results-count strong { color: var(--silver); font-size: 18px; font-weight: 300; }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .result-card:hover { border-color: var(--border-bright); }

    .result-card-header {
      background: var(--bg-alt);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-info {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: var(--card-bg-alt);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--silver-mid);
    }

    .source-badge svg { width: 12px; height: 12px; fill: currentColor; }

    .result-index {
      font-weight: 600;
      color: var(--silver);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .result-table th,
    .result-table td {
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .result-table th {
      width: 200px;
      color: var(--text-secondary);
      font-weight: 500;
      background: var(--bg-alt);
      white-space: nowrap;
    }

    .result-table td {
      cursor: pointer;
      transition: background 0.15s;
      color: var(--text);
    }

    .result-table td:hover { background: var(--card-bg-alt); }

    .edit-hint {
      opacity: 0;
      margin-left: 6px;
      color: var(--silver-mid);
      font-size: 11px;
      transition: opacity 0.15s;
    }

    .result-table td:hover .edit-hint { opacity: 0.7; }

    .result-table tr:last-child th,
    .result-table tr:last-child td { border-bottom: none; }

    .field-value-empty { color: var(--text-light); }

    /* No results */
    .no-results {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-secondary);
    }

    .no-results svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.2;
      fill: currentColor;
    }

    .no-results-title {
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--silver-mid);
    }

    .no-results-desc { font-size: 13px; }

    /* Loading */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--silver);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .spinner-lg { width: 36px; height: 36px; border-width: 3px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      gap: 16px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ==================== Edit Modal ==================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .modal-overlay.show { opacity: 1; visibility: visible; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 90%;
      max-width: 480px;
      padding: 28px;
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.show .modal { transform: scale(1); }

    .modal-title {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--silver);
    }

    .modal-title svg { width: 20px; height: 20px; }

    .modal-field { margin-bottom: 16px; }

    .modal-field label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg-alt);
      color: var(--text);
    }

    .modal-field input:focus {
      border-color: var(--silver-dark);
      box-shadow: 0 0 0 1px var(--silver-dark);
    }

    .modal-field input[readonly] {
      background: var(--bg);
      color: var(--text-secondary);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .modal-btn {
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .modal-btn.cancel { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-bright); }
    .modal-btn.cancel:hover { background: var(--card-bg-alt); color: var(--silver); border-color: var(--silver-dark); }
    .modal-btn.save { background: var(--metallic-btn); color: #0a0a0a; border: 1px solid var(--silver-dark); font-weight: 600; }
    .modal-btn.save:hover { background: linear-gradient(180deg, #f0f0f0, #d0d0d0); border-color: var(--silver); }
    .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ==================== Toast ==================== */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-bright);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.3s ease;
      max-width: 360px;
      color: var(--text);
      background: var(--card-bg);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .toast.success { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .toast.error { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
    .toast.info { background: var(--info-light); color: var(--info); border-color: var(--info); }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .header { padding: 0 12px; }
      .header-title { font-size: 14px; }
      .header-title .brand { font-size: 15px; }
      .header-title .brand-sub { display: none; }
      .header-right { gap: 6px; }
      .agent-badge { display: none; }
      .stats-bar { padding: 12px; gap: 8px; }
      .stat-card { min-width: 140px; padding: 12px; }
      .stat-value { font-size: 18px; }
      .main-content { padding: 0 12px 12px; }
      .tab-btn { padding: 10px 12px; font-size: 13px; }
      .agent-container { height: calc(100vh - 260px); }
      .chat-messages { padding: 16px; }
      .chat-message { max-width: 90%; }
      .chat-scroll-tip { padding: 12px 16px; }
      .chat-tip-list { grid-template-columns: 1fr; }
      .suggestions { padding: 10px 16px; }
      .chat-input-area { padding: 12px 16px; }
      .search-container { padding: 16px; }
      .result-table th { width: 110px; }
      .admin-link span { display: none; }
      .toast-container { right: 12px; left: 12px; }
      .toast { max-width: none; }
      /* Mobile: hide home and delta tabs, only show agent + search */
      #tabHomeBtn, #tabDeltaBtn { display: none !important; }
      .homepage-container, .delta-dashboard, #homeTab, #deltaTab, .stats-bar { display: none !important; }
      #agentTab.active, #searchTab.active { display: block !important; }
      .agent-container { height: calc(100vh - 180px); }
      .lang-switch-group { gap: 1px; padding: 1px; }
      .lang-btn { padding: 4px 8px; font-size: 11px; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--silver-dark); }

    /* ==================== Delta Dashboard ==================== */
    .delta-dashboard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: calc(100vh - var(--header-height) - 90px - 74px - 32px);
      min-height: 480px;
      max-height: calc(100vh - var(--header-height) - 90px - 74px - 32px);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* --- KPI Cards Row --- */
    .delta-kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr) auto;
      gap: 12px;
      align-items: stretch;
      flex-shrink: 0;
    }

    .kpi-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.2s;
      min-height: 0;
    }

    .kpi-card:hover {
      border-color: var(--border-bright);
    }

    .kpi-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .kpi-label {
      font-size: clamp(10px, 0.75vw, 12px);
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-value {
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 300;
      color: var(--silver);
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .kpi-sub {
      font-size: clamp(10px, 0.7vw, 11px);
      color: var(--text-light);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Delta Toggle --- */
    .delta-toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .delta-toggle {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .delta-toggle-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .delta-toggle-switch {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 2px;
      gap: 2px;
    }

    .delta-toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .delta-toggle-btn:hover {
      color: var(--silver);
    }

    .delta-toggle-btn.active {
      background: linear-gradient(180deg, #e8e8e8, #c0c0c0);
      color: #0a0a0a;
      font-weight: 600;
    }

    /* --- Main Grid Layout --- */
    .delta-main-grid {
      display: grid;
      grid-template-columns: 38% 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .delta-right-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* --- Panels --- */
    .delta-panel {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .delta-panel-title {
      font-size: clamp(11px, 0.8vw, 13px);
      font-weight: 500;
      color: var(--silver-mid);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delta-panel-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--silver);
      border-radius: 1px;
      flex-shrink: 0;
    }

    .delta-chart {
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    /* Tree panel fills left column fully */
    .delta-tree-panel {
      height: 100%;
      min-height: 0;
    }

    /* SVG double-funnel tree */
    .delta-tree-svg {
      width: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delta-tree-svg svg {
      width: 100%;
      height: 100%;
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Stage label (pre-TO, TO1, TO2) */
    .tree-stage-node rect {
      fill: #1a1a1a;
      stroke: #6b7280;
      stroke-width: 1.5;
      rx: 4;
      ry: 4;
    }
    .tree-stage-node text {
      fill: #c0c0c0;
      font-size: 12px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tree-stage-node .stage-sub {
      fill: #6b7280;
      font-size: 10px;
      font-weight: 400;
    }

    /* Delta node */
    .tree-delta-node rect {
      fill: #1e1e1e;
      stroke: #c0c0c0;
      stroke-width: 2;
      rx: 6;
      ry: 6;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      cursor: pointer;
      transition: all 0.2s;
    }
    .tree-delta-node text {
      fill: #e8e8e8;
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tree-delta-node .delta-count {
      fill: #c0c0c0;
      font-size: 11px;
      font-weight: 400;
    }
    .tree-delta-node:hover rect {
      stroke: #e8e8e8;
      fill: #252525;
    }
    .tree-delta-node.active rect {
      stroke: #ef4444;
      stroke-width: 2.5;
    }
    .tree-delta-node.active text {
      fill: #ef4444;
    }
    .tree-delta-node.active .delta-count {
      fill: #f87171;
    }

    /* Branch node (EC, ZEUS, etc.) */
    .tree-branch-node rect,
    .tree-branch-node .node-bg {
      fill: #1a1a1a;
      stroke: #4b5563;
      stroke-width: 1.5;
      rx: 12;
      ry: 12;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tree-branch-node text {
      fill: #9ca3af;
      font-size: 11px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .tree-branch-node .branch-count {
      fill: #6b7280;
      font-size: 10px;
      font-weight: 400;
    }
    .tree-branch-node:hover .node-bg {
      stroke: #9ca3af;
      fill: #252525;
    }
    .tree-branch-node.highlighted .node-bg {
      stroke: #ef4444;
      stroke-width: 2;
      fill: #1f1a1a;
    }
    .tree-branch-node.highlighted text {
      fill: #ef4444;
    }
    .tree-branch-node.highlighted .branch-count {
      fill: #f87171;
    }
    .tree-branch-node.dimmed .node-bg {
      stroke: rgba(120, 120, 120, 0.3);
      fill: rgba(20, 20, 20, 0.5);
      stroke-dasharray: 3 3;
    }
    .tree-branch-node.dimmed text {
      fill: rgba(180, 180, 180, 0.3);
    }
    .tree-branch-node.dimmed .branch-count {
      fill: rgba(120, 120, 120, 0.3);
    }

    /* Connector lines */
    .tree-line {
      fill: none;
      stroke: #6b7280;
      stroke-width: 2;
      transition: all 0.3s;
    }
    .tree-line.highlighted {
      stroke: #ef4444;
      stroke-width: 3.5;
    }
    .tree-line.dimmed {
      stroke: rgba(120, 120, 120, 0.25);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    /* SOMA bottom node */
    .tree-soma-node .node-bg {
      fill: #1e1e1e;
      stroke: #c0c0c0;
      stroke-width: 1.5;
      rx: 4;
      ry: 4;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tree-soma-node text {
      fill: #e8e8e8;
      font-size: 11px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .tree-soma-node .soma-count {
      fill: #9ca3af;
      font-size: 10px;
    }
    .tree-soma-node:hover .node-bg {
      stroke: #e8e8e8;
      fill: #252525;
    }
    .tree-soma-node.highlighted .node-bg {
      stroke: #ef4444;
      stroke-width: 2;
    }
    .tree-soma-node.highlighted text {
      fill: #ef4444;
    }
    .tree-soma-node.dimmed .node-bg {
      stroke: rgba(120, 120, 120, 0.3);
      stroke-dasharray: 3 3;
    }
    .tree-soma-node.dimmed text {
      fill: rgba(180, 180, 180, 0.3);
    }

    /* Selected (drill-down active) node styles */
    .tree-delta-node.selected rect,
    .tree-branch-node.selected .node-bg,
    .tree-soma-node.selected .node-bg {
      stroke: #f59e0b;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6));
    }
    .tree-delta-node.selected text,
    .tree-branch-node.selected text,
    .tree-soma-node.selected text {
      fill: #f59e0b;
      font-weight: 600;
    }
    .tree-delta-node.selected .delta-count,
    .tree-branch-node.selected .branch-count,
    .tree-soma-node.selected .soma-count {
      fill: #fbbf24;
    }

    /* Tooltip */
    .tree-tooltip {
      position: absolute;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #3a3a3a;
      border-radius: 3px;
      padding: 6px 10px;
      color: #e8e8e8;
      font-size: 11px;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tree-tooltip.show {
      opacity: 1;
    }

    /* Pie row */
    .delta-pie-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      flex-shrink: 0;
      flex: 0 0 auto;
    }

    .delta-pie-panel {
      min-height: 0;
    }

    .delta-pie-panel .delta-chart {
      height: clamp(160px, 18vh, 220px);
      min-height: 140px;
    }

    /* Bar-line panel */
    .delta-barline-panel {
      flex: 1;
      min-height: 0;
    }

    .delta-barline-panel .delta-chart {
      flex: 1;
      min-height: 160px;
    }

    /* ==================== Drill-down Modal ==================== */
    .drill-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }

    .drill-modal {
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      width: 100%;
      max-width: 1100px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .drill-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
    }

    .drill-header-info h3 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: var(--silver);
      margin-bottom: 4px;
    }

    .drill-header-info .drill-meta {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .drill-header-info .drill-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .drill-close {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .drill-close:hover {
      background: var(--danger-light);
      border-color: var(--danger);
      color: var(--danger);
    }

    .drill-close svg { width: 20px; height: 20px; }

    .drill-body {
      padding: 0;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .drill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .drill-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .drill-table th {
      background: var(--bg-alt);
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      border-bottom: 2px solid var(--border-bright);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 12px;
    }

    .drill-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drill-table tbody tr {
      transition: background 0.15s;
    }

    .drill-table tbody tr:hover {
      background: var(--card-bg-alt);
    }

    .drill-table .empty-val {
      color: var(--text-light);
      font-style: italic;
    }

    .drill-table .pn-cell {
      font-weight: 600;
      color: var(--silver);
      cursor: pointer;
    }

    .drill-table .pn-cell:hover {
      text-decoration: underline;
    }

    .drill-table-wrap {
      overflow-x: auto;
      width: 100%;
    }

    .drill-table .drill-th-source,
    .drill-table .drill-td-source {
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--bg-alt);
    }

    .drill-table .drill-td-source {
      background: var(--card-bg);
    }

    .drill-table tbody tr:hover .drill-td-source {
      background: var(--card-bg-alt);
    }

    .drill-table .drill-th-key {
      background: var(--warning-light) !important;
      color: var(--warning);
    }

    .drill-table .drill-td-key {
      background: var(--warning-light) !important;
      font-weight: 500;
    }

    .drill-table tbody tr:hover .drill-td-key {
      background: var(--warning-light) !important;
    }

    .drill-loading {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .drill-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--silver);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .drill-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-alt);
    }

    .drill-pagination {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drill-pagination button {
      padding: 6px 14px;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .drill-pagination button:hover:not(:disabled) {
      background: var(--card-bg-alt);
      border-color: var(--silver-dark);
      color: var(--silver);
    }

    .drill-pagination button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .drill-pagination .page-info {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 0 8px;
    }

    .drill-export-btn {
      padding: 8px 16px;
      background: transparent;
      color: var(--success);
      border: 1px solid var(--success);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .drill-export-btn:hover { background: var(--success); color: #fff; }
    .drill-export-btn svg { width: 16px; height: 16px; }

    /* ==================== Search History ==================== */
    .search-history {
      margin-bottom: 20px;
    }

    .search-history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-history-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-history-label svg { width: 14px; height: 14px; fill: currentColor; }

    .history-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .history-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--silver-mid);
      max-width: 300px;
    }

    .history-chip:hover {
      background: var(--card-bg-alt);
      border-color: var(--silver-dark);
      color: var(--silver);
    }

    .history-chip .chip-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: flex;
    }

    .history-chip .chip-icon svg { width: 14px; height: 14px; fill: currentColor; }

    .history-chip .chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-clear-btn {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .history-clear-btn:hover {
      background: var(--danger-light);
      border-color: var(--danger);
      color: var(--danger);
    }

    .history-clear-btn svg { width: 12px; height: 12px; fill: currentColor; }

    .no-history {
      font-size: 13px;
      color: var(--text-light);
      padding: 8px 0;
    }

    /* ==================== Compare Result ==================== */
    .compare-result {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--card-bg);
    }

    .compare-title {
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      color: var(--silver-mid);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-title svg { width: 14px; height: 14px; fill: var(--silver); }

    .compare-summary {
      display: flex;
      padding: 10px 14px;
      background: var(--primary-light);
      font-size: 13px;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .compare-summary-text {
      font-size: 13px;
      color: var(--silver-mid);
      flex: 1;
      min-width: 200px;
    }

    .compare-summary-bar {
      flex: 1;
      min-width: 120px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .compare-summary-bar .bar-same { background: var(--success); }
    .compare-summary-bar .bar-diff { background: var(--danger); }

    .compare-table-wrap {
      max-height: 400px;
      overflow-y: auto;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .compare-table th,
    .compare-table td {
      padding: 8px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      word-break: break-word;
    }

    .compare-table th {
      background: var(--bg-alt);
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 12px;
    }

    .compare-table th.field-col { width: 180px; }
    .compare-table th.val-col { min-width: 120px; }
    .compare-table td { color: var(--text); }

    .compare-table tr.compare-diff td {
      background: var(--danger-light);
    }

    .compare-table tr.compare-diff td:first-child {
      border-left: 3px solid var(--danger);
    }

    .compare-table tr.compare-same td.val-cell {
      color: var(--text-secondary);
    }

    .compare-table tr:last-child th,
    .compare-table tr:last-child td { border-bottom: none; }

    .compare-table .diff-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 2px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .compare-table .diff-badge.diff { background: var(--danger); color: #fff; }

    /* Dashboard responsive - Multiple breakpoints */
    /* Large screens (>1600px): spacious layout */
    @media (min-width: 1601px) {
      .delta-dashboard {
        padding: 20px 24px 24px;
        gap: 18px;
        height: calc(100vh - var(--header-height) - 90px - 74px - 32px);
        max-height: calc(100vh - var(--header-height) - 90px - 74px - 32px);
      }
      .delta-main-grid { gap: 18px; }
      .delta-right-col { gap: 18px; }
      .delta-kpi-row { gap: 14px; }
      .delta-panel { padding: 16px 18px; }
      .delta-panel-title { margin-bottom: 10px; }
      .kpi-card { padding: 14px 16px 16px; gap: 4px; }
      .delta-pie-row { gap: 18px; }
    }

    /* Standard screens (1200px - 1600px): default layout, no changes needed */

    /* Medium-small screens (900px - 1200px): tree and right column stack vertically */
    @media (max-width: 1200px) and (min-width: 901px) {
      .delta-dashboard {
        height: auto;
        max-height: none;
        min-height: auto;
      }
      .delta-main-grid {
        grid-template-columns: 1fr;
      }
      .delta-tree-panel {
        height: clamp(300px, 50vh, 450px);
      }
      .delta-kpi-row {
        grid-template-columns: repeat(3, 1fr) auto;
      }
      .delta-pie-panel .delta-chart {
        height: clamp(180px, 22vh, 240px);
      }
    }

    /* Small screens (<=900px): single column layout, pies also stack */
    @media (max-width: 900px) and (min-width: 769px) {
      .delta-dashboard {
        height: auto;
        max-height: none;
        min-height: auto;
        padding: 14px 16px 16px;
      }
      .delta-main-grid {
        grid-template-columns: 1fr;
      }
      .delta-tree-panel {
        height: clamp(280px, 45vh, 400px);
      }
      .delta-kpi-row {
        grid-template-columns: repeat(3, 1fr);
      }
      .delta-toggle-wrapper {
        grid-column: span 3;
        justify-content: center;
      }
      .delta-pie-row {
        grid-template-columns: 1fr;
      }
      .delta-pie-panel .delta-chart {
        height: clamp(200px, 25vh, 280px);
      }
    }

    /* Short viewport optimization (high zoom levels like 125%, 150%) */
    @media (max-height: 780px) {
      .delta-dashboard {
        padding: 12px 16px 14px;
        gap: 10px;
        height: calc(100vh - var(--header-height) - 70px - 64px - 24px);
        max-height: calc(100vh - var(--header-height) - 70px - 64px - 24px);
        min-height: 420px;
      }
      .delta-kpi-row { gap: 10px; }
      .kpi-card { padding: 8px 12px 10px; gap: 2px; }
      .delta-main-grid { gap: 10px; }
      .delta-right-col { gap: 10px; }
      .delta-panel { padding: 10px 14px; }
      .delta-panel-title { margin-bottom: 6px; }
      .delta-pie-row { gap: 10px; }
      .delta-pie-panel .delta-chart {
        height: clamp(140px, 20vh, 180px);
        min-height: 120px;
      }
    }

    @media (max-height: 620px) {
      .delta-dashboard {
        height: auto;
        max-height: none;
        min-height: auto;
      }
    }

    /* ==================== Delta 样式 ==================== */
    .delta-container { max-width: 100%; }
    .delta-stage-selector {
      display: flex; align-items: center; gap: 12px;
      background: var(--card-bg); padding: 18px; border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 16px; flex-wrap: wrap;
    }
    .delta-stage-selector label { color: var(--text-secondary); font-size: 14px; font-weight: 500; }
    .delta-stage-selector select {
      padding: 8px 14px; border: 1px solid var(--border-bright); border-radius: var(--radius-sm);
      font-size: 14px; font-family: inherit; background: var(--bg-alt); color: var(--text);
      outline: none; cursor: pointer;
    }
    .delta-stage-selector select:focus { border-color: var(--silver-dark); }
    .delta-stage-selector select option { background: var(--card-bg); color: var(--text); }
    .delta-stage-selector input {
      padding: 8px 14px; border: 1px solid var(--border-bright); border-radius: var(--radius-sm);
      font-size: 14px; flex: 1; min-width: 200px; background: var(--bg-alt); color: var(--text);
      font-family: inherit; outline: none;
    }
    .delta-stage-selector input::placeholder { color: var(--text-light); }
    .delta-stage-selector input:focus { border-color: var(--silver-dark); }
    .delta-stage-selector .btn-primary {
      padding: 8px 28px; background: var(--metallic-btn); color: #0a0a0a; border: 1px solid var(--silver-dark);
      border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 600;
      font-family: inherit; transition: all 0.2s;
    }
    .delta-stage-selector .btn-primary:hover { background: linear-gradient(180deg, #f0f0f0, #d0d0d0); border-color: var(--silver); }
    .delta-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: var(--card-bg); border: 1px solid var(--border-bright);
      border-radius: var(--radius); font-size: 13px; cursor: pointer; transition: all 0.2s;
      color: var(--text-secondary); font-family: inherit;
    }
    .filter-chip:hover { border-color: var(--silver-dark); color: var(--silver); }
    .filter-chip input { margin: 0; accent-color: var(--silver); }
    .filter-chip:has(input:checked) { background: var(--primary-light); border-color: var(--silver-dark); color: var(--silver); font-weight: 600; }
    .delta-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .delta-stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
    .delta-stat-card .num { font-size: 28px; font-weight: 300; color: var(--silver); letter-spacing: 0.5px; }
    .delta-stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    .delta-list { display: flex; flex-direction: column; gap: 12px; }
    .delta-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .delta-item-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: var(--bg-alt); cursor: pointer; transition: background 0.2s; }
    .delta-item-header:hover { background: var(--card-bg-alt); }
    .delta-item-header .pn { font-weight: 600; font-size: 15px; font-family: 'Consolas', 'Courier New', monospace; color: var(--silver); }
    .delta-item-header .match-badge { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--primary-light); color: var(--silver-mid); border: 1px solid var(--border-bright); }
    .delta-item-header .change-types { display: flex; gap: 6px; flex-wrap: wrap; }
    .delta-item-header .change-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 600; }
    .change-tag.added { background: var(--success-light); color: var(--success); border: 1px solid var(--success); }
    .change-tag.changed { background: var(--warning-light); color: var(--warning); border: 1px solid var(--warning); }
    .change-tag.upgraded { background: var(--info-light); color: var(--info); border: 1px solid var(--info); }
    .change-tag.removed { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); }
    .change-tag.resolved { background: var(--info-light); color: var(--info); border: 1px solid var(--info); }
    .change-tag.persisted { background: var(--card-bg-alt); color: var(--text-secondary); border: 1px solid var(--border-bright); }
    .delta-item-body { display: none; padding: 16px 18px; }
    .delta-item.expanded .delta-item-body { display: block; }
    .delta-field-row { display: grid; grid-template-columns: 100px 1fr 80px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .delta-field-row:last-child { border-bottom: none; }
    .delta-field-row .field-label { font-weight: 600; color: var(--silver-mid); }
    .delta-field-row .old-val, .delta-field-row .new-val { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; word-break: break-all; color: var(--text); }
    .delta-field-row .old-val.empty, .delta-field-row .new-val.empty { color: var(--text-light); font-style: italic; }
    .delta-field-row .arrow { text-align: center; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-sm); }
    .arrow.added { background: var(--success-light); color: var(--success); }
    .arrow.changed { background: var(--warning-light); color: var(--warning); }
    .arrow.upgraded { background: var(--info-light); color: var(--info); }
    .arrow.removed { background: var(--danger-light); color: var(--danger); }
    .arrow.resolved { background: var(--info-light); color: var(--info); }
    .arrow.persisted, .arrow.unchanged { background: var(--card-bg-alt); color: var(--text-secondary); }
    .arrow.unavailable { background: var(--bg); color: var(--text-light); }
    .delta-pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
    .delta-pagination button { padding: 8px 16px; border: 1px solid var(--border-bright); background: var(--card-bg); color: var(--text); border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
    .delta-pagination button:hover:not(:disabled) { background: var(--card-bg-alt); border-color: var(--silver-dark); color: var(--silver); }
    .delta-pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
    .delta-pagination .page-info { font-size: 14px; color: var(--text-secondary); }
    @media (max-width: 768px) {
      .delta-field-row { grid-template-columns: 80px 1fr 60px 1fr; font-size: 12px; }
      .delta-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

  <!-- ==================== Header ==================== -->
  <header class="header">

        <img src="/logo.png" alt="FBAC R&D Logo">
      </div>

        <span class="brand" data-i18n="title">van.ea</span>

      </div>

    <div class="header-right">

        <span class="dot"></span>

    // ==================== Utility ====================
    function t(key) {
      return (i18n[currentLang] && i18n[currentLang][key]) || key;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      // Tooltip translations (title attribute)
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.getAttribute('data-i18n-title'));
      });
      // Update language button active state
      document.querySelectorAll('#langSwitchGroup .lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
      // Update document language
      const langMap = { zh: 'zh-CN', en: 'en', de: 'de' };
      document.documentElement.lang = langMap[currentLang] || 'en';
      // Re-render dynamic content
      renderSuggestions();
      if (_statsData) renderStats(_statsData);
      if (_dashboardData) renderDashboard(_dashboardData);
      // Re-render Delta Dashboard charts if initialized
      if (_deltaInited) {
        renderDeltaTreeSVG();
        renderDeltaEcPie();
        renderDeltaZeusPie();
        renderDeltaBarLine();
        updateKpiCards(_deltaCurrent);
      }
      renderSearchHistory();
      // Re-render Delta list if loaded
      if (typeof deltaState !== 'undefined' && deltaState.deltas && deltaState.deltas.length > 0) {
        renderDeltaSummary(deltaState.summary || {});
        renderDeltaList(deltaState.deltas);
        if (deltaState.totalPages > 1) {
          renderDeltaPagination({ total: deltaState.total, total_pages: deltaState.totalPages, page: deltaState.page });
        }
      }
      // Re-render Delta detail modal if open
      if (window._deltaDetailData) {
        const modal = document.getElementById('deltaDetailModal');
        if (modal && modal.style.display !== 'none') {
          const fromStage = deltaState ? (deltaState.fromLabel || 'pre-TO') : 'pre-TO';
          const toStage = deltaState ? (deltaState.toLabel || 'TO1') : 'TO1';
          renderDeltaDetailContent(window._deltaDetailData, fromStage, toStage);
        }
      }
      // Update agent status text
      const statusEl = document.getElementById('agentModeText');
      if (statusEl && statusEl.dataset.mode) {
        statusEl.textContent = statusEl.dataset.mode === 'ollama' ? t('modeOllama') : t('modeRule');
      } else if (statusEl && statusEl.dataset.offline === 'true') {
        statusEl.textContent = t('agentOffline');
      }
      // Re-render search prompt if no search has been done
      const sr = document.getElementById('searchResults');
      if (sr && sr.dataset.empty === 'true') {
        sr.innerHTML = `<div class="no-results">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <p class="no-results-title">${t('searchPrompt')}</p>
        </div>`;
      }
      // Re-render chat tip if welcome message is visible
      updateChatTip();
    }

    function setLanguage(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      applyTranslations();
    }

    function toggleLanguage() {
      // Deprecated - kept for backward compatibility
      const order = ['zh', 'en', 'de'];
      const idx = order.indexOf(currentLang);
      currentLang = order[(idx + 1) % order.length];
      applyTranslations();
    }

    function showToast(message, type, duration) {
      type = type || 'info';
      duration = duration || 3000;
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        toast.style.transition = 'all 0.3s';
        setTimeout(function() { toast.remove(); }, 300);
      }, duration);
    }

    // ==================== Delta Dashboard ====================
    var _deltaCurrent = 2;       // Default: Delta2 (TO1→TO2)
    var _deltaInited = false;

      if (level === 'nozeus') {

        g.appendChild(nameText);
        var countText = _svgEl('text', { y: 9, class: 'branch-count' });

      // Delta1 side
      var d1NoEc = (data.delta1Count || data.to1.total) - data.to1.ecPn;
      svg.appendChild(createBranchNode(xDelta1NoEc, yEc, 1, 'noec', t('treeNoEc'), d1NoEc));

      // Delta2 side
      var d2NoEc = (data.delta2Count || data.to2.total) - data.to2.ecPn;

      svg.appendChild(createBranchNode(xDelta2EcZeus, yZeus, 2, 'zeus', t('treeHasZeus'), data.to2.favPn));

      // --- Draw SOMA nodes ---
      function createSomaNode(x, y, side, count) {
        var g = _svgEl('g', {
          class: 'tree-soma-node',

      svg.appendChild(createSomaNode(xDelta2Soma, ySoma, 2, data.to2.somaJa));

    // Tooltip helpers
    function _showTreeTooltip(e, text) {
      var tooltip = document.getElementById('treeTooltip');
      if (!tooltip) return;
      tooltip.innerHTML = text.replace(/\n/g, '<br/>');
      tooltip.classList.add('show');
      _moveTreeTooltip(e);
    }
    function _moveTreeTooltip(e) {
      var tooltip = document.getElementById('treeTooltip');
      var container = document.getElementById('deltaTreeSvg');
      if (!tooltip || !container) return;
      var rect = container.getBoundingClientRect();
      var x = e.clientX - rect.left + 12;
      var y = e.clientY - rect.top + 12;
      // Keep within bounds
      var tw = tooltip.offsetWidth;
      var th = tooltip.offsetHeight;
      if (x + tw > rect.width) x = e.clientX - rect.left - tw - 12;
      if (y + th > rect.height) y = e.clientY - rect.top - th - 12;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    }
    function _hideTreeTooltip() {
      var tooltip = document.getElementById('treeTooltip');
      if (tooltip) tooltip.classList.remove('show');
    }

    // Update SVG tree highlight based on selected delta
    function updateTreeSVGHighlight(deltaNum) {
      var container = document.getElementById('deltaTreeSvg');
      if (!container) return;

      var activeSide = 'delta' + deltaNum;
      var otherSide = deltaNum === 1 ? 'delta2' : 'delta1';

      // Update lines
      var lines = container.querySelectorAll('.tree-line');
      lines.forEach(function(line) {
        var side = line.getAttribute('data-side');
        var type = line.getAttribute('data-type');
        line.classList.remove('highlighted', 'dimmed');

        if (side === activeSide) {
          // Active side: "yes" path highlighted, "no" path normal
          if (type === 'funnel' || type === 'ec' || type === 'ec-zeus' || type === 'zeus-soma') {
            line.classList.add('highlighted');
          }
          // noec, ec-nozeus stay normal (silver)
        } else {
          // Other side: all dimmed
          line.classList.add('dimmed');
        }
      });

      // Update delta nodes
      var deltaNodes = container.querySelectorAll('.tree-delta-node');
      deltaNodes.forEach(function(node) {
        var side = node.getAttribute('data-side');
        node.classList.toggle('active', side === activeSide);
      });

      // Update branch nodes
      var branchNodes = container.querySelectorAll('.tree-branch-node');
      branchNodes.forEach(function(node) {
        var side = node.getAttribute('data-side');
        var type = node.getAttribute('data-type');
        node.classList.remove('highlighted', 'dimmed');

        if (side === activeSide) {
          // Active side: EC, ZEUS highlighted
          if (type === 'ec' || type === 'zeus') {
            node.classList.add('highlighted');
          }
          // noec, nozeus stay normal
        } else {
          node.classList.add('dimmed');
        }
      });

      // Update SOMA nodes
      var somaNodes = container.querySelectorAll('.tree-soma-node');
      somaNodes.forEach(function(node) {
        var side = node.getAttribute('data-side');
        node.classList.remove('highlighted', 'dimmed');
        if (side === activeSide) {
          node.classList.add('highlighted');
        } else {
          node.classList.add('dimmed');
        }
      });
    }

    // Handle tree node click (drill-down + pie chart联动)
    function _onTreeNodeClick(type, side) {
      // If clicking a delta node, switch delta selection
      if (type === 'delta') {
        switchDelta(side);
        return;
      }

      // For other node types, set drill-down filter level and update pie charts
      // type: 'ec', 'noec', 'zeus', 'nozeus', 'soma'
      // side: 1 or 2 (delta side)

      // First ensure we're on the correct delta side
      if (side !== _deltaCurrent) {
        switchDelta(side);
      }

      // Toggle: if clicking the same node again, reset to all
      if (_deltaFilterLevel === type && _deltaFilterSide === side) {
        _deltaFilterLevel = null;
        _deltaFilterSide = null;
      } else {
        _deltaFilterLevel = type;
        _deltaFilterSide = side;
      }

      // Update pie charts with filtered data
      updatePieCharts(_deltaCurrent);

      // Update node selection styles
      _updateTreeNodeSelection();
    }

    // Handle tree node double-click (navigate to Parts Search page)
    function _onTreeNodeDblClick(type, side) {
      var stageKey = side === 1 ? 'TO1' : 'TO2';
      var url = '';

      switch (type) {
        case 'delta':
          // Delta node: navigate to Delta page
          if (side === 1) {
            url = '/delta?from=pre-TO&to=TO1';
          } else {
            url = '/delta?from=TO1&to=TO2';
          }
          break;
        case 'ec':
          url = '/parts-search?stage=' + stageKey + '&has_ec=1';
          break;
        case 'noec':
          url = '/parts-search?stage=' + stageKey + '&has_ec=0';
          break;
        case 'zeus':
          url = '/parts-search?stage=' + stageKey + '&has_fav=1';
          break;
        case 'nozeus':
          url = '/parts-search?stage=' + stageKey + '&has_fav=0';
          break;
        case 'soma':
          url = '/parts-search?stage=' + stageKey + '&soma=ja';
          break;
        default:
          return;
      }

      if (url) {
        window.open(url, '_blank');
      }
    }

    // Update tree node selection visual state
    function _updateTreeNodeSelection() {
      var container = document.getElementById('deltaTreeSvg');
      if (!container) return;

      var level = _deltaFilterLevel;
      var side = _deltaFilterSide;

      // Clear all selected states first
      var allNodes = container.querySelectorAll('.tree-delta-node, .tree-branch-node, .tree-soma-node');
      allNodes.forEach(function(node) {
        node.classList.remove('selected');
      });

      if (!level || !side) return;

      var activeSide = 'delta' + side;

      // Find and highlight the selected node
      if (level === 'ec' || level === 'noec') {
        var ecNodes = container.querySelectorAll('.tree-branch-node[data-side="' + activeSide + '"][data-type="' + level + '"]');
        ecNodes.forEach(function(node) { node.classList.add('selected'); });
      } else if (level === 'zeus' || level === 'nozeus') {
        var zeusNodes = container.querySelectorAll('.tree-branch-node[data-side="' + activeSide + '"][data-type="' + level + '"]');
        zeusNodes.forEach(function(node) { node.classList.add('selected'); });
      } else if (level === 'soma') {
        var somaNodes = container.querySelectorAll('.tree-soma-node[data-side="' + activeSide + '"]');
        somaNodes.forEach(function(node) { node.classList.add('selected'); });
      }
    }

    function initDeltaDashboard() {
      if (_deltaInited) return;
      if (typeof echarts === 'undefined') return;

      var svgContainer = document.getElementById('deltaTreeSvg');
      var ecPieEl = document.getElementById('deltaEcPieChart');
      var zeusPieEl = document.getElementById('deltaZeusPieChart');
      var barLineEl = document.getElementById('deltaBarLineChart');

      if (!svgContainer || !ecPieEl || !zeusPieEl || !barLineEl) return;

      // Initialize ECharts instances with dark theme (pie + bar-line only)
      _deltaCharts.ecPie = echarts.init(ecPieEl);
      _deltaCharts.zeusPie = echarts.init(zeusPieEl);
      _deltaCharts.barLine = echarts.init(barLineEl);

      // Handle window resize
      var resizeTimer = null;
      window.addEventListener('resize', function() {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          Object.keys(_deltaCharts).forEach(function(key) {
            if (_deltaCharts[key]) _deltaCharts[key].resize();
          });
        }, 150);
      });

      // Fetch data from API, fallback to mock on failure
      fetch('/api/delta/dashboard')
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (json && json.success && json.data) {
            _deltaApiData = json.data;
          }
        })
        .catch(function(err) {
          console.warn('Delta dashboard API failed, using mock data:', err);
        })
        .then(function() {
          // Render all charts (with API data or mock fallback)
          renderDeltaTreeSVG();
          renderDeltaEcPie();
          renderDeltaZeusPie();
          renderDeltaBarLine();

          // Apply initial delta state (default: Delta2)
          updateKpiCards(_deltaCurrent);
          updatePieCharts(_deltaCurrent);

          _deltaInited = true;
        });
    }

    function switchDelta(deltaNum) {
      if (deltaNum === _deltaCurrent) return;
      _deltaCurrent = deltaNum;

      // Reset drill-down filter level when switching delta
      _deltaFilterLevel = null;
      _deltaFilterSide = null;

      // Update toggle buttons
      var btn1 = document.getElementById('deltaBtn1');
      var btn2 = document.getElementById('deltaBtn2');
      if (btn1) btn1.classList.toggle('active', deltaNum === 1);
      if (btn2) btn2.classList.toggle('active', deltaNum === 2);

      // Update all components
      updateKpiCards(deltaNum);
      updateTreeSVGHighlight(deltaNum);
      updatePieCharts(deltaNum);
      _updateTreeNodeSelection();
    }
