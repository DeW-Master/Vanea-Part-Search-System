    // ==================== Tab Switching ====================
    function isMobile() {
      return window.innerWidth <= 768;
    }

    function switchTab(tab) {
      // On mobile, only agent and search tabs are available
      if (isMobile() && (tab === 'home' || tab === 'delta')) {
        tab = 'agent';
      }
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      if (tab === 'home') {
        document.getElementById('tabHomeBtn').classList.add('active');
        document.getElementById('homeTab').classList.add('active');
        initDeltaDashboard();
        // Trigger chart resize after tab becomes visible
        setTimeout(function() {
          if (typeof _deltaCharts !== 'undefined') {
            Object.keys(_deltaCharts).forEach(function(key) {
              if (_deltaCharts[key]) _deltaCharts[key].resize();
            });
          }
        }, 50);
      } else if (tab === 'agent') {
        document.getElementById('tabAgentBtn').classList.add('active');
        document.getElementById('agentTab').classList.add('active');
      } else if (tab === 'delta') {
        document.getElementById('tabDeltaBtn').classList.add('active');
        document.getElementById('deltaTab').classList.add('active');
        if (!deltaState.loaded) {
          loadDelta(1);
          deltaState.loaded = true;
        }
      } else {
        document.getElementById('tabSearchBtn').classList.add('active');
        document.getElementById('searchTab').classList.add('active');
      }
    }

    // ==================== Dashboard ====================
    async function loadDashboard() {

          _dashboardData = json.data;
          renderDashboard(json.data);

    function destroyCharts() {
      Object.keys(chartInstances).forEach(function(key) {
        if (chartInstances[key]) {
          chartInstances[key].destroy();
          chartInstances[key] = null;
        }
      });
    }

        ec: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4h2v4zm0-6h-2V7h2v4z"/></svg>',
        database: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.58 3 4 4.79 4 7s3.58 4 8 4 8-1.79 8-4-3.58-4-8-4zm0 14c-4.42 0-8-1.79-8-4v3c0 2.21 3.58 4 8 4s8-1.79 8-4v-3c0 2.21-3.58 4-8 4z"/></svg>',

        { value: data.ec_count || 0, label: 'ecCount', color: 'green', icon: 'database', drill: { dim: 'ec', val: 'has_ec' } },

          '<div class="stat-info">' +

      // Destroy existing charts before recreating
      destroyCharts();

      // Common chart click handler for doughnut charts
      function makeDoughnutClickHandler(drillDim, drillValues) {
        return function(evt, elements) {
          if (elements.length > 0) {
            var idx = elements[0].index;
            openDrilldown(drillDim, drillValues[idx]);
          }

      }

      // ---- Chart 1: SOMA Distribution (doughnut) ----
      var somaYesVal = data.soma_yes || 0;
      var somaNoVal = data.soma_no || 0;
      if (data.soma_distribution && data.soma_distribution.length > 0) {
        somaYesVal = 0;
        somaNoVal = 0;
        data.soma_distribution.forEach(function(item) {
          var val = (item.value || '').toLowerCase();
          if (val === 'ja' || val === 'yes' || val === '是') somaYesVal += item.count;
          else somaNoVal += item.count;

      // ---- Chart 2: Source Distribution (bar) ----
      var sourceCtx = document.getElementById('sourceChart');
      var sourceLabels = [];
      var sourceData = [];
      if (sourceCtx) {
        if (data.source_distribution && data.source_distribution.length > 0) {

            covData.push(info.rate != null ? info.rate : 0);

          type: 'bar',
          data: {
            labels: covLabels,
            datasets: [{

              data: covData,
              backgroundColor: covData.map(function(v) { return v >= 80 ? '#28a745' : v >= 50 ? '#ffc107' : '#dc3545'; }),
              borderRadius: 4,
              hoverBackgroundColor: covData.map(function(v) { return v >= 80 ? '#1e7e34' : v >= 50 ? '#d39e00' : '#bd2130'; })
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            onClick: function(evt, elements) {
              if (elements.length > 0) {
                var idx = elements[0].index;
                openDrilldown('field', covLabels[idx]);
              }
            },
            onHover: function(evt, elements) { evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; },
            plugins: { legend: { display: false } },
            scales: {
              x: { beginAtZero: true, max: 100, ticks: { callback: function(v) { return v + '%'; } } }
            }
          }
        });
      }

      // ---- Chart 4: EC Distribution (doughnut) ----
      var ecCtx = document.getElementById('ecChart');
      if (ecCtx) {
        var ecPn = data.ec_pn_count || 0;
        var totalPn = data.unique_part_numbers || 0;
        var noEcPn = Math.max(0, totalPn - ecPn);
        chartInstances.ec = new Chart(ecCtx, {
          type: 'doughnut',
          data: {
            labels: [t('ecPNCount'), t('drillNoEc')],
            datasets: [{
              data: [ecPn, noEcPn],
              backgroundColor: ['#ffc107', '#e0e6ed'],
              borderWidth: 2,
              borderColor: '#ffffff',
              hoverOffset: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onClick: makeDoughnutClickHandler('ec', ['has_ec', 'no_ec']),
            onHover: function(evt, elements) { evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; },
            plugins: {
              legend: { position: 'bottom', labels: { font: { family: "'Noto Sans SC', sans-serif" } } },
              tooltip: { callbacks: {
                label: function(ctx) { return ctx.label + ': ' + ctx.raw + ' ' + t('drillRecords'); }
              }}
            }
          }
        });
      }

      // ---- Chart 5: Baulos Stages (grouped bar: PN count + EC count) ----
      var baulosCtx = document.getElementById('baulosChart');
      if (baulosCtx && data.baulos_stages && data.baulos_stages.length > 0) {
        var stages = data.baulos_stages;
        var stageLabels = stages.map(function(s) { return s.stage; });
        var pnData = stages.map(function(s) { return s.pn_count || 0; });
        var ecData = stages.map(function(s) { return s.ec_count || 0; });
        chartInstances.baulos = new Chart(baulosCtx, {
          type: 'bar',
          data: {
            labels: stageLabels,
            datasets: [
              { label: t('pnCount'), data: pnData, backgroundColor: '#0066cc', borderRadius: 6 },
              { label: t('ecCount'), data: ecData, backgroundColor: '#ffc107', borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onClick: function(evt, elements) {
              if (elements.length > 0) {
                var idx = elements[0].index;
                var stageVal = stages[idx].stage.split(' ')[0].toLowerCase();
                openDrilldown('baulos', stageVal);
              }
            },
            onHover: function(evt, elements) { evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; },
            plugins: {
              legend: { position: 'bottom', labels: { font: { family: "'Noto Sans SC', sans-serif" } } },

              '<div class="ec-res-value">' + (ecRes.to1_ec_count || 0) + '</div>' +

    var _drillState = { dimension: '', value: '', page: 1, pageSize: 20, data: null };

    function openDrilldown(dimension, value) {
      _drillState.dimension = dimension;
      _drillState.value = value;
      _drillState.page = 1;
      _drillState.data = null;

      // Set title based on dimension
      var titleMap = {
        'soma': { 'ja': t('drillSomaJa'), 'nein': t('drillSomaNein') },
        'ec': { 'has_ec': t('drillHasEC'), 'no_ec': t('drillNoEC') },
        'fav': { 'has_fav': t('drillHasFAV'), 'no_fav': t('drillNoFAV') },
        'all': { '': t('drillAllRecords') },
      };

      var titleText = '';
      if (dimension === 'source') {
        titleText = t('sourceCol') + ': ' + value;
      } else if (dimension === 'field') {
        var display = (_dashboardData && _dashboardData.col_display) ? (_dashboardData.col_display[value] || value) : value;
        titleText = t('drillFieldFilled') + ': ' + display;
      } else if (dimension === 'baulos') {
        titleText = t('baulosStages') + ': ' + value.toUpperCase();
      } else if (titleMap[dimension] && titleMap[dimension][value]) {
        titleText = titleMap[dimension][value];
      } else {
        titleText = dimension + ': ' + value;
      }

      document.getElementById('drillTitle').textContent = titleText;
      document.getElementById('drillMeta').innerHTML = '';
      document.getElementById('drillFooter').style.display = 'none';
      document.getElementById('drillBody').innerHTML =
        '<div class="drill-loading"><div class="spinner"></div><span>' + t('loading') + '</span></div>';
      document.getElementById('drillOverlay').style.display = 'flex';

      loadDrilldownData();
    }

    async function loadDrilldownData() {
      try {
        var res = await fetch('/api/dashboard/drilldown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dimension: _drillState.dimension,
            value: _drillState.value,
            page: _drillState.page,
            page_size: _drillState.pageSize,
          })
        });
        var json = await res.json();
        if (json.success) {
          _drillState.data = json.data;
          renderDrilldownTable(json.data);
        } else {
          document.getElementById('drillBody').innerHTML =
            '<div class="drill-loading"><span>' + (json.error || t('loadFailed')) + '</span></div>';
        }
      } catch (e) {
        console.error('Drilldown error:', e);
        document.getElementById('drillBody').innerHTML =
          '<div class="drill-loading"><span>' + t('loadFailed') + '</span></div>';
      }
    }

    function renderDrilldownTable(data) {
      var body = document.getElementById('drillBody');
      var footer = document.getElementById('drillFooter');

      // Update meta info
      var metaHtml = '<span>' + t('drillTotal').replace('{n}', data.total) + '</span>';
      if (data.total_pages > 1) {
        metaHtml += '<span>' + t('drillPage').replace('{cur}', data.page).replace('{total}', data.total_pages) + '</span>';
      }
      document.getElementById('drillMeta').innerHTML = metaHtml;

      if (!data.records || data.records.length === 0) {
        body.innerHTML = '<div class="drill-loading"><span>' + t('drillNoData') + '</span></div>';
        footer.style.display = 'none';
        return;
      }

      // Build table with all fields
      var allFields = data.all_fields || [];
      var colDisplay = data.col_display || {};

      // Determine which column is the "key" (drill-down dimension) for highlighting
      var keyCol = '';
      var dim = data.dimension || '';
      if (dim === 'soma') {
        keyCol = allFields.find(function(f) { return f.toLowerCase().indexOf('soma') >= 0; }) || '';
      } else if (dim === 'ec') {
        keyCol = allFields.find(function(f) { return f.toLowerCase().indexOf('ec') >= 0 || f.toLowerCase().indexOf('fehler') >= 0; }) || '';
      } else if (dim === 'fav') {
        keyCol = allFields.find(function(f) { return f.toLowerCase().indexOf('fav') >= 0 || f.toLowerCase().indexOf('zeus') >= 0; }) || '';
      } else if (dim === 'baulos') {
        keyCol = allFields.find(function(f) { return f.toLowerCase().indexOf('baulos') >= 0; }) || '';
      } else if (dim === 'field') {
        keyCol = data.value || '';
      }

      var html = '<div class="drill-table-wrap"><table class="drill-table"><thead><tr>';
      html += '<th class="drill-th-source">' + t('sourceCol') + '</th>';
      allFields.forEach(function(f) {
        var isKey = (f === keyCol);
        html += '<th' + (isKey ? ' class="drill-th-key"' : '') + '>' + escapeHtml(colDisplay[f] || f) + (isKey ? ' ★' : '') + '</th>';
      });
      html += '</tr></thead><tbody>';

      data.records.forEach(function(rec) {
        html += '<tr>';
        // Source column
        var sourceLabel = rec._source_file || '';
        if (rec._source_sheet) sourceLabel += ' / ' + rec._source_sheet;
        html += '<td class="drill-td-source"><span class="empty-val">' + escapeHtml(sourceLabel || '--') + '</span></td>';

        allFields.forEach(function(f) {
          var val = rec[f];
          var isKey = (f === keyCol);
          if (f === 'Part Number' && val) {
            html += '<td class="pn-cell' + (isKey ? ' drill-td-key' : '') + '" onclick="drillClickPN(\'' + escapeAttr(val) + '\')">' + escapeHtml(val) + '</td>';
          } else if (val === '' || val == null) {
            html += '<td' + (isKey ? ' class="drill-td-key"' : '') + '><span class="empty-val">--</span></td>';
          } else {
            html += '<td' + (isKey ? ' class="drill-td-key"' : '') + ' title="' + escapeAttr(String(val)) + '">' + escapeHtml(String(val)) + '</td>';
          }
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      body.innerHTML = html;

      // Render pagination
      renderDrilldownPagination(data);
      footer.style.display = 'flex';
    }

    function renderDrilldownPagination(data) {
      var container = document.getElementById('drillPagination');
      if (data.total_pages <= 1) {
        container.innerHTML = '<span class="page-info">' + t('drillTotal').replace('{n}', data.total) + '</span>';
        return;
      }

      var html = '';
      html += '<button onclick="drillGoPage(' + (data.page - 1) + ')" ' + (data.page <= 1 ? 'disabled' : '') + '>' + t('drillPrev') + '</button>';
      html += '<span class="page-info">' + t('drillPage').replace('{cur}', data.page).replace('{total}', data.total_pages) + '</span>';
      html += '<button onclick="drillGoPage(' + (data.page + 1) + ')" ' + (data.page >= data.total_pages ? 'disabled' : '') + '>' + t('drillNext') + '</button>';
      container.innerHTML = html;
    }

    function drillGoPage(page) {
      if (page < 1) return;
      _drillState.page = page;
      document.getElementById('drillBody').innerHTML =
        '<div class="drill-loading"><div class="spinner"></div><span>' + t('loading') + '</span></div>';
      loadDrilldownData();
    }

    function drillClickPN(pn) {
      closeDrilldown();
      switchTab('search');
      setTimeout(function() {
        var input = document.getElementById('searchInput');
        if (input) {
          input.value = pn;
          performSearch();
        }
      }, 100);
    }

    function closeDrilldown() {
      document.getElementById('drillOverlay').style.display = 'none';
      _drillState.data = null;
    }

    function exportDrillData() {
      if (!_drillState.data || !_drillState.data.records) return;

      var data = _drillState.data;
      var allFields = data.all_fields || [];
      var colDisplay = data.col_display || {};

      // Build CSV
      var headers = [t('sourceCol')].concat(allFields.map(function(f) { return colDisplay[f] || f; }));
      var rows = [headers.join(',')];

      data.records.forEach(function(rec) {
        var sourceLabel = (rec._source_file || '') + (rec._source_sheet ? ' / ' + rec._source_sheet : '');
        var row = [csvEscape(sourceLabel)];
        allFields.forEach(function(f) {
          row.push(csvEscape(rec[f] || ''));
        });
        rows.push(row.join(','));
      });

      // Download
      var csv = '\ufeff' + rows.join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'drilldown_' + data.dimension + '_' + (data.value || 'all') + '_p' + data.page + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvEscape(val) {
      var s = String(val == null ? '' : val);
      if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    // ==================== Columns ====================
    async function loadColumns() {
      try {
        const res = await fetch('/api/columns');
        const json = await res.json();
        if (json.success && json.data) {

          if (extra.intent) {
            const intentTag = document.createElement('span');
            intentTag.className = 'chat-tag intent';
            if (typeof extra.intent === 'object') {
              intentTag.textContent = extra.intent.question_type || 'query';

        if (extra.search_results && extra.search_results.length > 0) {

    var _agentAbortController = null;

    async function sendAgentQuery(queryText) {
      const input = document.getElementById('chatInput');
      const query = queryText || input.value.trim();
      if (!query) {
        showToast(t('enterQuestion'), 'error');
        return;
      }

      addMessage(query, 'user');
      addSearchHistory('agent', query);
      input.value = '';
      input.style.height = 'auto';

      const sendBtn = document.getElementById('sendBtn');
      const stopBtn = document.getElementById('stopBtn');
      sendBtn.disabled = true;
      sendBtn.style.display = 'none';
      stopBtn.style.display = 'flex';

      showTypingIndicator();

      _agentAbortController = new AbortController();

      try {
        const res = await fetch('/api/agent/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, lang: currentLang }),
          signal: _agentAbortController.signal
        });
        const json = await res.json();

        hideTypingIndicator();

        if (json.success) {
          addMessage(json.response || t('noData'), 'agent', {
            mode: json.mode,
            is_table_related: json.is_table_related,
            intent: json.intent,
            search_results: json.search_results,
            is_compare: json.is_compare,
            compare_result: json.compare_result
          });
        } else {
          addMessage(t('requestFailed'), 'agent');
        }
      } catch (e) {
        hideTypingIndicator();
        if (e.name === 'AbortError') {
          addMessage(currentLang === 'zh' ? '⏹ 已停止生成' : '⏹ Generation stopped', 'agent');
        } else {
          addMessage(t('requestFailed'), 'agent');
        }
        console.error('Agent query error:', e);
      } finally {
        sendBtn.disabled = false;
        sendBtn.style.display = 'flex';
        stopBtn.style.display = 'none';
        _agentAbortController = null;
        // 每次查询后刷新建议问题
        renderSuggestions();
      }
    }

    function stopAgentQuery() {
      if (_agentAbortController) {
        _agentAbortController.abort();
      }
    }

    // ==================== Model Management ====================
    async function loadModels() {
      try {
        // Fetch both models and backend status in parallel
        const [modelsRes, backendRes] = await Promise.all([
          fetch('/api/agent/models'),
          fetch('/api/agent/backend')
        ]);
        const json = await modelsRes.json();
        const backendJson = await backendRes.json();

        if (json.success) {
          const selector = document.getElementById('modelSelector');
          const modeEl = document.getElementById('modelMode');
          const labelEl = document.querySelector('.model-label');
          selector.innerHTML = '';

          const backend = backendJson.success ? backendJson.backend : 'local';
          const cloudConfig = backendJson.success ? backendJson.cloud_config : null;
          const cloudAvailable = backendJson.success ? backendJson.cloud_available : false;

          if (backend === 'cloud') {
            // Cloud mode - show cloud model, disable local selector
            selector.innerHTML = '<option value="">' +
              (cloudConfig && cloudConfig.model ? cloudConfig.model : 'Not configured') +
              '</option>';
            selector.disabled = true;
            selector.style.opacity = '0.6';
            if (labelEl) labelEl.textContent = currentLang === 'zh' ? '云端模型' : 'Cloud Model';
            if (modeEl) {
              modeEl.textContent = currentLang === 'zh' ? '线上算力' + (cloudAvailable ? ' ✓' : ' ⚠') : 'Cloud' + (cloudAvailable ? ' ✓' : ' ⚠');
              modeEl.className = 'model-mode cloud';
            }
          } else {
            // Local mode - show local Ollama models
            selector.disabled = false;
            selector.style.opacity = '1';
            if (labelEl) labelEl.textContent = currentLang === 'zh' ? '当前模型' : 'Current Model';
            json.models.forEach(function(m) {
              const opt = document.createElement('option');
              opt.value = m.name;
              opt.textContent = m.name + (m.size_gb ? ' (' + m.size_gb + 'GB)' : '');
              if (m.is_current) opt.selected = true;
              selector.appendChild(opt);
            });
            if (json.models.length === 0) {
              selector.innerHTML = '<option value="">No model installed</option>';
            }
            if (modeEl) {
              const isOllama = json.models.length > 0;
              modeEl.textContent = isOllama ? (currentLang === 'zh' ? '本地算力' : 'Local (Ollama)') : 'Rule-based';
              modeEl.className = 'model-mode' + (isOllama ? '' : ' rule');
            }
          }
        }
      } catch (e) {
        console.error('Failed to load models:', e);
      }
    }

    function renderSearchResults(data) {
      const resultsDiv = document.getElementById('searchResults');

      if (!data.data || data.data.length === 0) {
        renderNoResults();
        return;
      }

      let html =
        '<div class="search-results-header">' +
          '<div class="search-results-count">' +
            t('found') + ' <strong>' + data.total_results + '</strong> ' + t('results') +
          '</div>' +

      data.data.forEach(function(record, index) {
        html += renderResultCard(record, index);
      });

      html += '</div>';
      resultsDiv.innerHTML = html;
    }

    function renderResultCard(record, index) {
      // Separate metadata (_-prefixed keys) from regular fields
      var metadata = {};
      var fields = {};
      Object.keys(record).forEach(function(key) {
        if (key.charAt(0) === '_') {
          metadata[key] = record[key];
        } else {
          fields[key] = record[key];
        }
      });

      var recordId = metadata._record_id || '';
      var sourceFile = metadata._source_file || '';
      var sourceSheet = metadata._source_sheet || '';

      var fieldsHtml = '';
      Object.keys(fields).forEach(function(key) {
        var colInfo = columnsMap[key];
        var display = (colInfo && colInfo.display_name) ? colInfo.display_name : key;
        var rawVal = fields[key];
        var valStr = (rawVal !== null && rawVal !== undefined) ? String(rawVal) : '';
        var displayVal = valStr ? escapeHtml(valStr) : '<span class="field-value-empty">--</span>';

        fieldsHtml +=
          '<tr>' +
            '<th>' + escapeHtml(display) + '</th>' +
            '<td class="editable-cell" ' +
              'data-record-id="' + escapeAttr(recordId) + '" ' +
              'data-field="' + escapeAttr(key) + '" ' +
              'data-display="' + escapeAttr(display) + '" ' +
              'data-value="' + escapeAttr(valStr) + '">' +
              displayVal +
              '<span class="edit-hint">&#9998;</span>' +
            '</td>' +
          '</tr>';
      });

      var sourceHtml = '';
      if (sourceFile) {
        sourceHtml += '<span class="source-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>' + escapeHtml(sourceFile) + '</span>';
      }
      if (sourceSheet) {
        sourceHtml += '<span class="source-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v13h17V5H4zm10 2v3h-3V7h3zm-5 0v3H6V7h3zm-3 5h3v3H6v-3zm5 0h3v3h-3v-3z"/></svg>' + escapeHtml(sourceSheet) + '</span>';
      }

      return (
        '<div class="result-card">' +
          '<div class="result-card-header">' +
            '<div class="source-info">' + sourceHtml + '</div>' +
            '<span class="result-index">#' + (index + 1) + '</span>' +
          '</div>' +
          '<table class="result-table">' + fieldsHtml + '</table>' +
        '</div>'
      );
    }

    // Render compact record cards for chat inline display
    function renderRecordCards(records, container) {
      container.innerHTML = '';
      records.forEach(function(record, index) {
        var metadata = {};
        var fields = {};
        Object.keys(record).forEach(function(key) {
          if (key.charAt(0) === '_') {
            metadata[key] = record[key];
          } else {
            fields[key] = record[key];
          }
        });

        var sourceFile = metadata._source_file || '';
        var sourceSheet = metadata._source_sheet || '';

        var fieldsHtml = '';
        Object.keys(fields).forEach(function(key) {
          var colInfo = columnsMap[key];
          var display = (colInfo && colInfo.display_name) ? colInfo.display_name : key;
          var rawVal = fields[key];
          var valStr = (rawVal !== null && rawVal !== undefined) ? String(rawVal) : '--';
          fieldsHtml += '<span class="field-label">' + escapeHtml(display) + ':</span><span>' + escapeHtml(valStr) + '</span>';
        });

        var card = document.createElement('div');
        card.className = 'chat-record-card';
        var sourceLine = '';
        if (sourceFile) sourceLine += escapeHtml(sourceFile);
        if (sourceSheet) sourceLine += (sourceLine ? ' \u203A ' : '') + escapeHtml(sourceSheet);
        sourceLine += (sourceLine ? ' \u00B7 ' : '') + '#' + (index + 1);

        card.innerHTML =
          '<div class="record-source">' + sourceLine + '</div>' +
          '<div class="record-fields">' + fieldsHtml + '</div>';
        container.appendChild(card);
      });
    }

    // ==================== Autocomplete ====================
    function handleAutocomplete() {
      var input = document.getElementById('searchInput');
      var dropdown = document.getElementById('autocompleteDropdown');
      var value = input.value.trim().toLowerCase();

      if (!value || allPartNumbers.length === 0) {
        hideAutocomplete();
        return;
      }

      var matches = [];
      for (var i = 0; i < allPartNumbers.length && matches.length < 20; i++) {
        if (allPartNumbers[i].toLowerCase().indexOf(value) !== -1) {
          matches.push(allPartNumbers[i]);
        }
      }

      if (matches.length === 0) {
        hideAutocomplete();
        return;
      }

      activeAutocompleteIndex = -1;
      dropdown.innerHTML = matches.map(function(pn, i) {
        return '<div class="autocomplete-item" data-value="' + escapeAttr(pn) + '" data-index="' + i + '">' + escapeHtml(pn) + '</div>';
      }).join('');
      dropdown.classList.add('show');
    }

    function hideAutocomplete() {
      document.getElementById('autocompleteDropdown').classList.remove('show');
      activeAutocompleteIndex = -1;
    }

    function selectAutocomplete(value) {
      document.getElementById('searchInput').value = value;
      hideAutocomplete();
      performSearch();
    }

    function handleAutocompleteKeydown(e) {
      var dropdown = document.getElementById('autocompleteDropdown');
      if (!dropdown.classList.contains('show')) return;

      var items = dropdown.querySelectorAll('.autocomplete-item');

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeAutocompleteIndex = Math.min(activeAutocompleteIndex + 1, items.length - 1);
        updateActiveAutocomplete(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeAutocompleteIndex = Math.max(activeAutocompleteIndex - 1, 0);
        updateActiveAutocomplete(items);
      } else if (e.key === 'Enter' && activeAutocompleteIndex >= 0) {
        e.preventDefault();
        if (items[activeAutocompleteIndex]) {
          selectAutocomplete(items[activeAutocompleteIndex].dataset.value);
        }
      } else if (e.key === 'Escape') {
        hideAutocomplete();
      }
    }

    function updateActiveAutocomplete(items) {
      items.forEach(function(item, i) {
        if (i === activeAutocompleteIndex) {
          item.classList.add('active');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      });
    }

    // ==================== Search History ====================
    var HISTORY_KEY = 'parts_search_history';
    var HISTORY_MAX = 10;

    function getSearchHistory() {
      try {
        var raw = localStorage.getItem(HISTORY_KEY);
        if (!raw) return [];
        var arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function addSearchHistory(type, query) {
      if (!query || !query.trim()) return;
      var history = getSearchHistory();
      // Remove duplicates (same query + type)
      history = history.filter(function(item) {
        return !(item.query === query && item.type === type);
      });
      // Add to front
      history.unshift({ type: type, query: query.trim(), timestamp: Date.now() });
      // Limit to HISTORY_MAX
      if (history.length > HISTORY_MAX) history = history.slice(0, HISTORY_MAX);
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) {
        console.error('Failed to save history:', e);
      }
      renderSearchHistory();
    }

    function clearSearchHistory() {
      try {
        localStorage.removeItem(HISTORY_KEY);
      } catch (e) {}
      renderSearchHistory();
    }

    function renderSearchHistory() {
      var container = document.getElementById('searchHistoryContainer');
      if (!container) return;
      var history = getSearchHistory();

      var html = '<div class="search-history-header">' +
        '<span class="search-history-label">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>' +
          t('searchHistory') +
        '</span>';

      if (history.length > 0) {
        html += '<button class="history-clear-btn" onclick="clearSearchHistory()">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>' +
          t('clearHistory') +
        '</button>';
      }
      html += '</div>';

      if (history.length === 0) {
        html += '<div class="no-history">' + t('noHistory') + '</div>';
      } else {
        html += '<div class="history-chips">';
        history.forEach(function(item, index) {
          var icon = item.type === 'agent'
            ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';
          html += '<button class="history-chip" onclick="runHistoryItem(' + index + ')">' +
            '<span class="chip-icon">' + icon + '</span>' +
            '<span class="chip-text">' + escapeHtml(item.query) + '</span>' +
          '</button>';
        });
        html += '</div>';
      }

      container.innerHTML = html;
    }

    function runHistoryItem(index) {
      var history = getSearchHistory();
      var item = history[index];
      if (!item) return;
      if (item.type === 'agent') {
        switchTab('agent');
        sendAgentQuery(item.query);
      } else {
        switchTab('search');
        document.getElementById('searchInput').value = item.query;
        performSearch();
      }
    }

    // ==================== Compare Result ====================
    function renderCompareResult(compareResult) {
      if (!compareResult || !compareResult.success) return '';

      var allFields = compareResult.all_fields || [];
      var record1 = compareResult.record1 || {};
      var record2 = compareResult.record2 || {};
      var differences = compareResult.differences || [];
      var diffFields = {};
      differences.forEach(function(d) { diffFields[d.field] = d; });

      var total = compareResult.total_fields || allFields.length;
      var same = compareResult.same_count !== undefined ? compareResult.same_count : (total - differences.length);
      var diff = compareResult.diff_count !== undefined ? compareResult.diff_count : differences.length;

      var summaryText = t('compareSummary')
        .replace('{total}', total)
        .replace('{same}', same)
        .replace('{diff}', diff);

      var samePct = total > 0 ? Math.round((same / total) * 100) : 0;
      var diffPct = total > 0 ? 100 - samePct : 0;

      var rowsHtml = '';
      allFields.forEach(function(field) {
        var isDiff = !!diffFields[field];
        var colInfo = columnsMap[field];
        var display = (colInfo && colInfo.display_name) ? colInfo.display_name : field;
        var val1 = record1[field];
        var val2 = record2[field];
        var val1Str = (val1 !== null && val1 !== undefined && val1 !== '') ? escapeHtml(String(val1)) : '<span class="field-value-empty">--</span>';
        var val2Str = (val2 !== null && val2 !== undefined && val2 !== '') ? escapeHtml(String(val2)) : '<span class="field-value-empty">--</span>';
        var rowClass = isDiff ? 'compare-diff' : 'compare-same';
        var badge = isDiff ? '<span class="diff-badge diff">' + (currentLang === 'zh' ? '不同' : 'Diff') + '</span>' : '';

        rowsHtml += '<tr class="' + rowClass + '">' +
          '<th class="field-col">' + escapeHtml(display) + badge + '</th>' +
          '<td class="val-cell">' + val1Str + '</td>' +
          '<td class="val-cell">' + val2Str + '</td>' +
        '</tr>';
      });

      return '<div class="compare-result">' +
        '<div class="compare-title">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-5h-2v5H5V5h5V3zm3 0v2h3.59l-9.29 9.29 1.41 1.41L18 6.41V10h2V3h-5z"/></svg>' +
          t('compareResult') +
        '</div>' +
        '<div class="compare-summary">' +
          '<span class="compare-summary-text">' + escapeHtml(summaryText) + '</span>' +
          '<div class="compare-summary-bar">' +
            '<div class="bar-same" style="width:' + samePct + '%"></div>' +
            '<div class="bar-diff" style="width:' + diffPct + '%"></div>' +
          '</div>' +
        '</div>' +
        '<div class="compare-table-wrap">' +
          '<table class="compare-table">' +
            '<thead><tr>' +
              '<th class="field-col">' + t('fieldName') + '</th>' +
              '<th class="val-col">' + t('record1') + ' (' + escapeHtml(compareResult.value1 || '') + ')</th>' +
              '<th class="val-col">' + t('record2') + ' (' + escapeHtml(compareResult.value2 || '') + ')</th>' +
            '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
    }

    // ==================== Edit Modal ====================
    function showEditModal(recordId, field, displayName, currentValue) {
      editContext = { recordId: recordId, field: field, displayName: displayName };
      document.getElementById('editFieldName').value = displayName;
      document.getElementById('editCurrentValue').value = currentValue;
      document.getElementById('editNewValue').value = currentValue;
      document.getElementById('editModal').classList.add('show');
      setTimeout(function() {
        document.getElementById('editNewValue').focus();
        document.getElementById('editNewValue').select();
      }, 100);
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
      editContext = null;
    }

    async function saveCellEdit() {
      if (!editContext) return;

      var saveBtn = document.getElementById('saveEditBtn');
      var originalText = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = t('saving');

      try {
        var res = await fetch('/api/update_cell', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            record_id: editContext.recordId,
            field: editContext.field,
            value: document.getElementById('editNewValue').value
          })
        });
        var json = await res.json();

        if (json.success) {
          showToast(t('saveSuccess'), 'success');
          closeEditModal();
          performSearch();
        } else {
          showToast(t('saveFailed'), 'error');
        }
      } catch (e) {
        showToast(t('saveFailed'), 'error');
        console.error('Save error:', e);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    }

    // ==================== Init ====================
    document.addEventListener('DOMContentLoaded', function() {
      // Mark search results as empty initially
      document.getElementById('searchResults').dataset.empty = 'true';

      // Apply translations
      applyTranslations();

      // Load data from APIs
      loadStats();
      loadColumns();
      loadAllPartNumbers();
      loadAgentStatus();
      loadModels();
      loadVersionInfo();
      renderSearchHistory();

      // Initialize delta dashboard (home tab)
      if (!isMobile()) {
        initDeltaDashboard();
      }

      // Mobile: switch to agent tab since home is hidden
      if (isMobile()) {
        switchTab('agent');
      }

      // Welcome message
      addMessage(t('welcomeMsg'), 'agent');

      // Handle resize for mobile tab constraints
      var lastWidth = window.innerWidth;
      window.addEventListener('resize', function() {
        var newWidth = window.innerWidth;
        if ((lastWidth > 768 && newWidth <= 768) || (lastWidth <= 768 && newWidth > 768)) {
          // Crossing breakpoint - re-evaluate active tab
          var activeBtn = document.querySelector('.tab-btn.active');
          if (activeBtn) {
            var activeTab = activeBtn.id.replace('tab', '').replace('Btn', '').toLowerCase();
            // Map properly
            if (activeBtn.id === 'tabHomeBtn') activeTab = 'home';
            else if (activeBtn.id === 'tabAgentBtn') activeTab = 'agent';
            else if (activeBtn.id === 'tabDeltaBtn') activeTab = 'delta';
            else activeTab = 'search';
            switchTab(activeTab);
          }
        }
        lastWidth = newWidth;
      });

      // Chat input events
      var chatInput = document.getElementById('chatInput');
      chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendAgentQuery();
        }
      });
      chatInput.addEventListener('input', function() {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
      });

      // Search input events
      var searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', handleAutocomplete);
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          if (activeAutocompleteIndex >= 0 && document.getElementById('autocompleteDropdown').classList.contains('show')) {
            handleAutocompleteKeydown(e);
          } else {
            hideAutocomplete();
            performSearch();
          }
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Escape') {
          handleAutocompleteKeydown(e);
        }
      });
      searchInput.addEventListener('blur', function() {
        setTimeout(hideAutocomplete, 200);
      });

      // Autocomplete click delegation
      document.getElementById('autocompleteDropdown').addEventListener('click', function(e) {
        var item = e.target.closest('.autocomplete-item');
        if (item) {
          selectAutocomplete(item.dataset.value);
        }
      });

      // Editable cell click delegation
      document.addEventListener('click', function(e) {
        var cell = e.target.closest('.editable-cell');
        if (cell) {
          showEditModal(
            cell.dataset.recordId,
            cell.dataset.field,
            cell.dataset.display,
            cell.dataset.value
          );
        }
      });

      // Edit modal: close on overlay click
      document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target.id === 'editModal') {
          closeEditModal();
        }
      });

      // Edit modal: Enter to save, Escape to close
      document.getElementById('editNewValue').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveCellEdit();
        }
      });

      // Global Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeEditModal();
          closeDrilldown();
          hideAutocomplete();
        }
      });
    });
  </script>
  <script src="delta.js"></script>
  <script>
    // ============ 并发搜索控制 + SSE实时通知 ============
    var _concurrentSessionId = localStorage.getItem('concurrent_session_id') || '';
    var _sseSource = null;
    var _heartbeatTimer = null;
    var _wasFull = false;

    function updateConcurrencyBanner(count, max, available) {
      var banner = document.getElementById('concurrencyBanner');
      var text = document.getElementById('concurrencyBannerText');
      if (!banner || !text) return;

      if (count >= max) {
        // 并发已满 - 红色警告
        banner.style.display = 'block';
        banner.style.background = 'rgba(255,107,107,0.15)';
        banner.style.color = '#ff9999';
        banner.style.borderBottomColor = 'rgba(255,107,107,0.3)';
        text.innerHTML = '⚠️ 当前并发搜索已满（' + count + '/' + max + '），请稍候再试。系统将在有空闲时自动提醒。';
        _wasFull = true;
      } else if (_wasFull && available > 0) {
        // 刚释放出槽位 - 绿色提示
        banner.style.display = 'block';
        banner.style.background = 'rgba(0,255,136,0.1)';
        banner.style.color = '#66ffaa';
        banner.style.borderBottomColor = 'rgba(0,255,136,0.3)';
        text.innerHTML = '✅ 有空闲槽位了（' + count + '/' + max + '），现在可以搜索了！';
        _wasFull = false;
        // 5秒后自动隐藏
        setTimeout(function() {
          if (!_wasFull) banner.style.display = 'none';
        }, 5000);
      } else {
        // 正常状态 - 隐藏
        banner.style.display = 'none';
        _wasFull = false;
      }
    }

    function initConcurrencySSE() {
      if (typeof EventSource === 'undefined') return;
      try {
        _sseSource = new EventSource('/api/concurrent/stream');
        _sseSource.onmessage = function(e) {
          try {
            var data = JSON.parse(e.data);
            updateConcurrencyBanner(data.count, data.max, data.available);
          } catch(err) {}
        };
        _sseSource.onerror = function() {
          // 连接断开后5秒重连
          setTimeout(initConcurrencySSE, 5000);
        };
      } catch(e) {}
    }

    // 尝试获取并发槽位（在搜索/问答前调用）
    function tryAcquireConcurrent(callback) {
      if (!_concurrentSessionId) {
        _concurrentSessionId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('concurrent_session_id', _concurrentSessionId);
      }
      fetch('/api/concurrent/acquire', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: _concurrentSessionId})
      }).then(function(r) {
        if (r.status === 429) {
          // 并发已满
          r.json().then(function(data) {
            updateConcurrencyBanner(data.count, data.max, data.available);
            if (callback) callback(false, data);
          });
        } else {
          r.json().then(function(data) {
            if (data.acquired) {
              updateConcurrencyBanner(data.count, data.max, data.available);
              startHeartbeat();
              if (callback) callback(true, data);
            }
          });
        }
      }).catch(function() {
        if (callback) callback(true, null); // 网络错误时放行
      });
    }

    function releaseConcurrent() {
      if (!_concurrentSessionId) return;
      fetch('/api/concurrent/release', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: _concurrentSessionId})
      }).catch(function(){});
      stopHeartbeat();
    }

    function startHeartbeat() {
      stopHeartbeat();
      _heartbeatTimer = setInterval(function() {
        if (!_concurrentSessionId) return;
        fetch('/api/concurrent/heartbeat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({session_id: _concurrentSessionId})
        }).catch(function(){});
      }, 30000);
    }

    function stopHeartbeat() {
      if (_heartbeatTimer) {
        clearInterval(_heartbeatTimer);
        _heartbeatTimer = null;
      }
    }

    // 页面卸载时释放槽位
    window.addEventListener('beforeunload', function() {
      if (_concurrentSessionId) {
        // 使用sendBeacon确保请求发送
        if (navigator.sendBeacon) {
          var data = new FormData();
          data.append('session_id', _concurrentSessionId);
          navigator.sendBeacon('/api/concurrent/release', data);
        }
      }
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      initConcurrencySSE();
    });
  </script>
