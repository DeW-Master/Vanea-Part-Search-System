# ============================================
# van.ea 告警规则 + 记录规则
# 版本: v2.0.0 (Phase 3)
# ============================================

groups:
  # ---------- 记录规则: 预计算常用指标 ----------
  - name: van_ea_recording_rules
    interval: 30s
    rules:
      # API 请求速率 (1m / 5m 平均)
      - record: job:http_requests_per_second:rate1m
        expr: rate(http_requests_total[1m])
        labels:
          window: "1m"
      - record: job:http_requests_per_second:rate5m
        expr: rate(http_requests_total[5m])
        labels:
          window: "5m"

      # API P95/P99 延迟 (1m / 5m)
      - record: job:http_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, instance, endpoint, method))
        labels:
          quantile: "0.95"
          window: "5m"
      - record: job:http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, instance, endpoint, method))
        labels:
          quantile: "0.99"
          window: "5m"

      # 错误率
      - record: job:http_error_rate:ratio5m
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (instance) / sum(rate(http_requests_total[5m])) by (instance)
        labels:
          window: "5m"

      # Redis 命中率
      - record: job:redis_cache_hit_ratio:ratio5m
        expr: rate(redis_cache_hits_total[5m]) / (rate(redis_cache_hits_total[5m]) + rate(redis_cache_misses_total[5m]))
        labels:
          window: "5m"

      # Delta 计算延迟
      - record: job:delta_compute_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum(rate(delta_compute_duration_seconds_bucket[5m])) by (le, instance, stage_comparison))
        labels:
          quantile: "0.95"
          window: "5m"

  # ---------- 告警规则 ----------
  - name: van_ea_alert_rules
    interval: 30s
    rules:
      # 应用实例宕机
      - alert: VanEaInstanceDown
        expr: up{job="van-ea-app"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "van.ea 实例 {{ $labels.instance }} 宕机"
          description: "实例 {{ $labels.instance }} 超过 1 分钟无法访问"
          runbook_url: "https://wiki.example.com/runbooks/vanea-down"

      # 可用实例数 < 期望
      - alert: VanEaInsufficientReplicas
        expr: count(up{job="van-ea-app"} == 1) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "van.ea 可用实例数不足: {{ $value }} < 2"
          description: "健康实例数低于 2，可能存在单点故障风险"

      # HTTP 5xx 错误率 > 5%
      - alert: VanEaHighErrorRate
        expr: job:http_error_rate:ratio5m > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "实例 {{ $labels.instance }} 5xx 错误率过高: {{ $value | humanizePercentage }}"
          description: "过去 5 分钟 5xx 错误率超过 5%"

      # API P99 延迟 > 2s
      - alert: VanEaHighLatency
        expr: job:http_request_duration_seconds:p99_5m{quantile="0.99"} > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "接口 {{ $labels.endpoint }} P99 延迟过高: {{ $value }}s"
          description: "接口 {{ $labels.endpoint }} P99 延迟超过 2 秒"

      # Redis 命中率 < 70%
      - alert: VanEaLowCacheHitRatio
        expr: job:redis_cache_hit_ratio:ratio5m < 0.7
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis 缓存命中率过低: {{ $value | humanizePercentage }}"
          description: "过去 10 分钟 Redis 缓存命中率低于 70%"

      # Delta 预计算失败
      - alert: VanEaDeltaComputeFailed
        expr: increase(delta_compute_errors_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Delta 预计算在过去 10 分钟内出现 {{ $value }} 次错误"
          description: "请检查 backend 日志确认 Delta 预计算失败原因"

      # Ollama 节点全部不可用
      - alert: VanEaOllamaAllNodesDown
        expr: ollama_healthy_nodes == 0
        for: 2m
        labels:
          severity: critical
          team: ai
        annotations:
          summary: "Ollama 所有节点均不可用"
          description: "AI 智能体功能不可用，请检查 Ollama 集群状态"

      # Ollama 队列过长
      - alert: VanEaOllamaQueueBacklog
        expr: ollama_pending_requests > 20
        for: 5m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "Ollama 待处理请求队列积压: {{ $value }}"
          description: "AI 请求积压严重，建议扩容 Ollama 实例"

      # PostgreSQL 连接池饱和
      - alert: VanEaPostgresConnectionsHigh
        expr: (sum(pg_stat_database_numbackends) by (datname) / 200) > 0.8
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "数据库 {{ $labels.datname }} 连接使用率 > 80%"
          description: "当前连接数: {{ $value }}"

      # 磁盘使用 > 85%
      - alert: VanEaDiskSpaceHigh
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "节点 {{ $labels.instance }} 磁盘使用率 {{ $value }}% > 85%"
          description: "请及时清理磁盘空间"
