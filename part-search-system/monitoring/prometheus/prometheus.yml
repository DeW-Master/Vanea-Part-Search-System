# ============================================
# Prometheus 配置 - van.ea 车辆零件智能查询系统
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'van-ea-prod'
    environment: 'production'
    project: 'van-ea-parts-search'

# 规则文件 (告警规则 + 记录规则)
rule_files:
  - "rules/*.yml"
  - "rules/*.yaml"

# Alertmanager 配置 (可选)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ---------- van.ea Flask 应用 ----------
  - job_name: 'van-ea-app'
    metrics_path: '/metrics'
    scheme: 'http'
    # 使用 DNS 服务发现 (Docker Swarm / Compose)
    dns_sd_configs:
      - names:
          - 'tasks.part-search'   # Swarm 模式: 多副本 A 记录
          - 'part-search'          # Compose 模式: 单副本/VIP
        type: 'A'
        port: 5000
        refresh_interval: 10s
    # 备用: 静态配置 (不启用服务发现时)
    # static_configs:
    #   - targets:
    #       - 'part-search-1:5000'
    #       - 'part-search-2:5000'
    #       - 'part-search-3:5000'
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance
      - source_labels: [__address__]
        regex: '^(.+):(\d+)$'
        target_label: hostname
        replacement: '${1}'
    metric_relabel_configs:
      - source_labels: [instance_id]
        target_label: instance_id

  # ---------- Nginx ----------
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s
    scrape_timeout: 5s

  # ---------- Redis (需 redis_exporter, 未部署时保持注释) ----------
  # 启用方式: 在 compose/stack 中新增 redis-exporter 服务并取消下方注释
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #   scrape_interval: 30s
  #   scrape_timeout: 5s

  # ---------- PostgreSQL (需 postgres_exporter, 未部署时保持注释) ----------
  # 启用方式: 在 compose/stack 中新增 postgres-exporter 服务并取消下方注释
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   scrape_interval: 30s
  #   scrape_timeout: 5s

  # ---------- Prometheus 自身 ----------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 5s

  # ---------- Node Exporter (主机监控, 可选部署) ----------
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   scrape_interval: 15s
  #   scrape_timeout: 5s

  # ---------- cAdvisor (容器监控, 可选部署) ----------
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #   scrape_interval: 30s
  #   scrape_timeout: 10s

  # ---------- Ollama (如在同网络) ----------
