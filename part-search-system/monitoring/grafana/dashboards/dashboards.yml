# ============================================
# Grafana 仪表盘自动配置
# ============================================

apiVersion: 1

providers:
  - name: 'van-ea-dashboards'
    orgId: 1
    folder: 'van.ea 零件查询系统'
    folderUid: 'vanea-dashboards'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
